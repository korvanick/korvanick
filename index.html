<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make it happen. Do it right. - korvanick</title>
    <!-- Theme before paint: dark is the stylesheet default, so this only has to
         act when the visitor has chosen light. Inline and synchronous on purpose --
         an external or deferred script runs after the first paint and would flash. -->
    <script>(function(){try{if(localStorage.getItem("theme")==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}})();</script>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/index.css">
    <link rel="icon" href="/images/favicon/favicon.ico" type="image/x-icon">
    <script src="/scripts/nav.js" defer></script>

</head>
<body class="page-fill">
    <nav></nav>

    <!-- Hero: headline / video / headline -->
    <div class="content-container fill">
        <!-- Block 1: Make it happen -->
        <div class="block" id="block-1">
            <h1 class="hero-line">Make it happen.</h1>
        </div>

        <!-- Block 2: Video -->
        <div class="block" id="block-2">
            <video id="hero-video"
                   autoplay
                   muted
                   loop
                   playsinline
                   disablepictureinpicture
                   preload="metadata"
                   poster="/images/home-poster.jpg">
                <source src="/media/20230219_064535.mp4" type="video/mp4">
            </video>
        </div>

        <!-- Block 3: Do it right -->
        <div class="block" id="block-3">
            <h1 class="hero-line">Do it right.</h1>
        </div>
    </div>

    <!-- Playback policy lives here rather than in CSS.
         Reduced motion: leave the video paused so it renders its poster frame.
         Hiding it in CSS left an empty block instead of the still it promised.
         Autoplay blocked (Low Power Mode and friends): same outcome, plus a
         class so the poster can be forced as a background if it fails to decode. -->
    <script>
        (function () {
            var v = document.getElementById('hero-video');
            if (!v) return;
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                v.removeAttribute('autoplay');
                v.pause();
                return;
            }
            var p = v.play();
            if (p && typeof p.catch === 'function') {
                p.catch(function () { v.classList.add('autoplay-blocked'); });
            }
        })();
    </script>

    <!-- Link to the external JavaScript file -->
    <script src="/scripts/index.js"></script>
</body>
</html>
