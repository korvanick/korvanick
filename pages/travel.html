<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel - Korvanick</title>
    <meta name="description" content="A map of everywhere Nick Korhonen has been and everywhere he still wants to go, with notes on the places worth writing about.">
    <link rel="canonical" href="https://korvanick.com/travel">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Korvanick">
    <meta property="og:url" content="https://korvanick.com/travel">
    <meta property="og:title" content="Travel">
    <meta property="og:description" content="Everywhere I have been and everywhere I still want to go.">
    <link rel="icon" href="/images/favicon/favicon.ico" type="image/x-icon">

    <!-- Theme before paint: dark is the stylesheet default, so this only has to
         act when the visitor has chosen light. Inline and synchronous on purpose --
         an external or deferred script runs after the first paint and would flash. -->
    <script>(function(){try{if(localStorage.getItem("theme")==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}})();</script>

    <!-- Leaflet's stylesheet FIRST: travel.css overrides its popup and tooltip
         colours, and a later sheet would win those at equal specificity. -->
    <link rel="stylesheet" href="/vendor/leaflet/1.9.4/leaflet.css">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/travel.css">
    <script src="/vendor/leaflet/1.9.4/leaflet.js" defer></script>

    <script src="/scripts/nav.js" defer></script>
    <script src="/scripts/modal.js" defer></script>
    <script src="/scripts/travel.js" defer></script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebPage",
      "name": "Travel",
      "url": "https://korvanick.com/travel",
      "description": "An interactive map of the places Nick Korhonen has visited and the ones still on his list.",
      "author": { "@type": "Person", "name": "Nick Korhonen", "url": "https://korvanick.com/professional" }
    }
    </script>
</head>
<body class="page-fill">
    <nav></nav>

    <!-- <main> carries .container.fill itself rather than wrapping it:
         styles.css matches `body.page-fill > .fill` as a DIRECT child, so an
         extra wrapper would collapse the map's height. -->
    <main class="container fill">
        <h1 class="visually-hidden">Travel</h1>
        <div class="map" id="map"></div>
    </main>
</body>
</html>
