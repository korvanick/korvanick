<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>EIA Data - Korvanick</title>
    <!-- Theme before paint: dark is the stylesheet default, so this only has to
         act when the visitor has chosen light. Inline and synchronous on purpose --
         an external or deferred script runs after the first paint and would flash. -->
    <script>(function(){try{if(localStorage.getItem("theme")==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}})();</script>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="icon" href="/images/favicon/favicon.ico" type="image/x-icon">
</head>
<body>
    <!-- Unlisted work in progress: no header, not in the nav, not indexed. -->
    <div class="content-container">
        <h1>EIA Data</h1>
        <p>Energy data from the EIA.</p>

        <div id="energyData">
            <p>Loading data...</p>
        </div>
    </div>

    <script src="/scripts/hidden1.js"></script>
</body>
</html>
